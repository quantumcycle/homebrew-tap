name: Update spex cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. v0.1.0). Leave empty for latest."
        required: false

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch release info
        id: release
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            API_URL="https://api.github.com/repos/quantumcycle/spex/releases/tags/${{ inputs.version }}"
          else
            API_URL="https://api.github.com/repos/quantumcycle/spex/releases/latest"
          fi
          VERSION=$(curl -fsSL "$API_URL" | jq -r '.tag_name')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Fetch checksums
        id: checksums
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          CHECKSUMS=$(curl -fsSL "https://github.com/quantumcycle/spex/releases/download/${VERSION}/checksums.sha256.txt")
          echo "amd64=$(echo "$CHECKSUMS" | grep 'spex-darwin-amd64' | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "arm64=$(echo "$CHECKSUMS" | grep 'spex-darwin-arm64' | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Write cask
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          mkdir -p Casks
          cat > Casks/spex.rb <<EOF
          cask "spex" do
            version "${VERSION#v}"

            on_arm do
              url "https://github.com/quantumcycle/spex/releases/download/${VERSION}/spex-darwin-arm64"
              sha256 "${{ steps.checksums.outputs.arm64 }}"
              binary "spex-darwin-arm64", target: "spex"
            end

            on_intel do
              url "https://github.com/quantumcycle/spex/releases/download/${VERSION}/spex-darwin-amd64"
              sha256 "${{ steps.checksums.outputs.amd64 }}"
              binary "spex-darwin-amd64", target: "spex"
            end

            homepage "https://github.com/quantumcycle/spex"
            desc "A generic parallel process runner with a live terminal UI"
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/spex.rb
          git diff --cached --quiet || git commit -m "Update spex cask to ${{ steps.release.outputs.version }}"
          git push
